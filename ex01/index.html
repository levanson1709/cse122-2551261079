<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bốn mùa</title>
</head>
<body>
    <div class = "continer" >
        <h1>BỐN MÙA</h1>

        <div class = "blue">
            <p>Xuân về hoa nở khắp trời<br> 
            Hạ sang nắng cháy rạng ngời phố quen<br>
            Thu về lá rụng bên thềm</p>
        </div>
        <hr>
        <div class = "red">
            <p>Đông sang gió lạnh bên em đợi chờ<br>
            Bốn mùa là bốn giấc mơ<br>
            Thời gian đi mãi ta chờ đợi ai</p>
        </div>
        <hr>
        <div class = "blue">
            <p>Một năm rồi lại một năm<br>
            Vẫn còn câu hát thì thầm quê hương<br>
            Chờ xuân nắng mới soi đường</p>
        </div>
    </div>
</body>

<style>
    h1{
        color :#D40000 ;
        font-size : 26px ;
        background-color :#FFD9E6 ;
        padding: 6px 0;
        margin: 0 0 20px;
    }
    .blue{
        color:#0033CC;
        font-weight: bold;
        font-style: italic;
       
        line-height: 1.7;
    }
    .red{
        color :#D40000;
        font-weight: bold;
        font-style: italic;

        line-height: 1.7;
    }
    
    body{
        background-color : white ; 
        display: flex ;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        text-align: center;
    }
    .continer{
        background-color :#FFFDE7 ;
        width : 640px ;
        padding: 24px ;
        border : 1px solid #9E9E9E ;
    }
    hr{
        border: none;
        background-color: blue ;
        height: 1px ;
        width: 352px;
    }
</style>
</html>
