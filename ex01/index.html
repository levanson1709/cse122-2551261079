<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bốn mùa</title>
    <link rel="stylesheet" href="css/style.css" ;
</head>
<body>
    <div class = "continer" >
        <h1>BỐN MÙA</h1>

        <div class = "blue">
            <p>Xuân về hoa nở khắp trời<br> 
            Hạ sang nắng cháy rạng ngời phố quen<br>
            Thu về lá rụng bên thềm</p>
        </div>
        <hr>
        <div class = "red">
            <p>Đông sang gió lạnh bên em đợi chờ<br>
            Bốn mùa là bốn giấc mơ<br>
            Thời gian đi mãi ta chờ đợi ai</p>
        </div>
        <hr>
        <div class = "blue">
            <p>Một năm rồi lại một năm<br>
            Vẫn còn câu hát thì thầm quê hương<br>
            Chờ xuân nắng mới soi đường</p>
        </div>
    </div>
</body>
</html>
